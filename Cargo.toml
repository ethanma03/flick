[package]
name = "flick"
version = "0.1.0"
edition = "2024"
description = "Simple, fast video player for everyday use"
build = "build.rs"

[lib]
name = "flick"
path = "src/lib.rs"

# Console front-end: CLI, headless ffmpeg ops, talks to the player over a named pipe.
[[bin]]
name = "flick"
path = "src/main.rs"

# GUI front-end (windows subsystem, no console flash). File associations point here.
[[bin]]
name = "flickw"
path = "src/gui_main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", features = ["image-data"] }
clap = { version = "4.6.7", features = ["derive"] }
# glow (OpenGL) rather than wgpu: libmpv's render API draws with OpenGL.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libloading = "0.9.0"
notify = "8.2.0"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.2.9"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_OpenGL",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
